[platformio]
default_envs = epaper_154_app

; 配置逐行来自 esp32_test 的 [env:epaper_154]（v0.7.10，提交 d5221ec）。
; 这块板是 N8R8：8MB flash + 8MB OPI PSRAM。memory_type / psram_type 写错
; 会表现为「启动就 panic」或「PSRAM 分配静默失败」，不要凭印象改。
[env:epaper_154_base]
platform  = espressif32@7.0.1
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.flash_mode = qio
board_build.f_flash    = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size   = 8MB
board_upload.maximum_size = 8388608
board_build.partitions    = default_8MB.csv

build_src_filter =
    +<*>
    +<../lib/bsp_core/>
    +<../boards/epaper_154/>
    -<../boards/epaper_154/docs/>
    +<../assets/generated/>

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I boards/epaper_154
    -I lib/bsp_api
    -I assets/generated
    -DBOARD_HAS_PSRAM

[env:epaper_154_app]
extends = env:epaper_154_base
build_flags =
    ${env:epaper_154_base.build_flags}
    -DAPP_MODE=3
    -DAPP_PARTIAL_MAX_STREAK=4

[env:epaper_154_m0]
extends = env:epaper_154_base
build_flags =
    ${env:epaper_154_base.build_flags}
    -DAPP_MODE=1

[env:epaper_154_m1]
extends = env:epaper_154_base
build_flags =
    ${env:epaper_154_base.build_flags}
    -DAPP_MODE=2

[env:epaper_154]
extends = env:epaper_154_app
